name: Bug report
description: Something in the nodes behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Issues here are public. Remove the API key, the webhook address with its ?token=,
        channel and chat IDs, and strip client names, phone numbers and message texts out of
        any sample before pasting it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: The n8n version and the version of this package.
      placeholder: "n8n 2.3.1, @zenland-dev/n8n-nodes-wazzup24 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: node
    attributes:
      label: Which node
      options:
        - Wazzup24
        - Wazzup24 Trigger
    validations:
      required: true

  - type: input
    id: operation
    attributes:
      label: Resource and operation
      placeholder: "Message → Send"

  - type: dropdown
    id: key
    attributes:
      label: Which kind of key
      description: A sidecar key opens only channels, sending, webhook settings and templates.
      options:
        - API integration key
        - Sidecar key (amoCRM or Bitrix24 integration)
        - Not sure

  - type: textarea
    id: response
    attributes:
      label: What Wazzup answered
      description: >
        The error text the node showed, with the code in square brackets, e.g.
        "Wazzup POST /v3/message: … [CHANNEL_NOT_FOUND]", and the channel type (WhatsApp, WABA,
        Telegram Bot…).
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        For the trigger: Registration (Automatic or Manual), the events selected, and one sample
        delivery with the personal data removed.
