name: Feature request
description: A missing route, field or convenience
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The workflow you are building, not only the call you are missing.
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: The Wazzup route, if you know it
      placeholder: "POST /v3/message"

  - type: textarea
    id: docs
    attributes:
      label: Where it is documented
      description: >
        A link to wazzup24.ru/help/api-ru or wazzup24.com/help/api-en. Until a route has an
        operation of its own, Custom Request of the Wazzup24 node calls it with the same key and
        rate limit.
